name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Root Debug Keystore Exists
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f ./debug.keystore

      - name: Verify Debug Keystore
        run: |
          pwd
          ls -la ./debug.keystore
          keytool -list -keystore ./debug.keystore -storepass android

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Created
        run: |
          if [ ! -s app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app/build/outputs/apk/debug/app-debug.apk not found or is empty!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug APK Build #$GITHUB_RUN_NUMBER" \
            --notes "Automated Debug APK build from run #$GITHUB_RUN_NUMBER (attempt #$GITHUB_RUN_ATTEMPT)." \
            --latest
